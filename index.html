<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengajuan Magang Online</title>
    <!-- Menggunakan Tailwind CSS untuk desain yang cepat dan modern -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-800">

    <!-- Navbar / Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600">InternHub</h1>
            <span class="text-sm text-gray-500">Portal Lowongan Magang</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-10">
        
        <!-- Informasi Pembuka -->
        <div class="text-center mb-10">
            <h2 class="text-3xl font-extrabold text-gray-900 sm:text-4xl mb-3">
                Formulir Pengajuan Magang
            </h2>
            <p class="text-lg text-gray-600">
                Isi data diri Anda dengan lengkap untuk bergabung sebagai *internee* di perusahaan kami.
            </p>
        </div>

        <!-- Formulir Pengajuan -->
        <!-- GANTI 'EMAIL_ANDA@GMAIL.COM' dengan email aktif Anda untuk menerima data -->
        <div class="bg-white p-8 rounded-2xl shadow-md border border-gray-100">
            <form action="https://formspree.io/f/EMAIL_ANDA@GMAIL.COM" method="POST" enctype="multipart/form-data" class="space-y-6">
                
                <!-- Nama Lengkap -->
                <div>
                    <label for="name" class="block text-sm font-semibold text-gray-700 mb-1">Nama Lengkap</label>
                    <input type="text" name="Nama" id="name" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <!-- Kontak (Email & WA) -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Alamat Email</label>
                        <input type="email" name="Email" id="email" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label for="whatsapp" class="block text-sm font-semibold text-gray-700 mb-1">Nomor WhatsApp</label>
                        <input type="tel" name="WhatsApp" id="whatsapp" placeholder="08xxxxxxxxxx" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <!-- Asal Institusi -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="institution" class="block text-sm font-semibold text-gray-700 mb-1">Asal Sekolah / Kampus</label>
                        <input type="text" name="Institusi" id="institution" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label for="major" class="block text-sm font-semibold text-gray-700 mb-1">Jurusan / Program Studi</label>
                        <input type="text" name="Jurusan" id="major" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                </div>

                <!-- Posisi Magang yang Dilamar -->
                <div>
                    <label for="position" class="block text-sm font-semibold text-gray-700 mb-1">Posisi Magang yang Diminati</label>
                    <select name="Posisi Dilamar" id="position" required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <option value="">-- Pilih Posisi --</option>
                        <option value="Web Developer">Web Developer Intern</option>
                        <option value="UI/UX Designer">UI/UX Designer Intern</option>
                        <option value="Content Writer">Content Writer Intern</option>
                        <option value="Digital Marketing">Digital Marketing Intern</option>
                    </select>
                </div>

                <!-- Periode Magang -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="start-date" class="block text-sm font-semibold text-gray-700 mb-1">Tanggal Mulai</label>
                        <input type="date" name="Tanggal Mulai" id="start-date" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label for="duration" class="block text-sm font-semibold text-gray-700 mb-1">Durasi Magang</label>
                        <select name="Durasi" id="duration" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                            <option value="1 Bulan">1 Bulan</option>
                            <option value="3 Bulan">3 Bulan</option>
                            <option value="6 Bulan">6 Bulan</option>
                        </select>
                    </div>
                </div>

                <!-- Link CV / Portofolio -->
                <div>
                    <label for="portfolio" class="block text-sm font-semibold text-gray-700 mb-1">Link CV / Portofolio (Google Drive/GitHub/Behance)</label>
                    <input type="url" name="Link Portofolio" id="portfolio" placeholder="https://..." required 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <p class="text-xs text-gray-400 mt-1">*Pastikan link tidak dikunci/bisa diakses publik.</p>
                </div>

                <!-- Tombol Submit -->
                <div class="pt-2">
                    <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition duration-150 ease-in-out cursor-pointer text-center">
                        Kirim Pengajuan Magang
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-100 border-t border-gray-200 mt-20 py-6 text-center text-sm text-gray-500">
        &copy; 2026 InternHub. Hak Cipta Dilindungi.
    </footer>

</body>
</html>
